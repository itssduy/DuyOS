LABEL duyos
TEXT HELP
Boot the DuyOS live on BIOS.
Starts the Hyprland + Caelestia desktop as the "duyos" user.
ENDTEXT
MENU LABEL DuyOS live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# DuyOS: text-mode boot (no automatic desktop start)
LABEL duyostext
TEXT HELP
Boot DuyOS to the text console without starting Hyprland.
Use this if the desktop does not work with your VM's graphics.
ENDTEXT
MENU LABEL DuyOS live, ^text mode (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% duyos.nodesktop %KERNEL_PARAMS%

# Accessibility boot option
LABEL duyosspeech
TEXT HELP
Boot the DuyOS live on BIOS with speakup screen reader.
Starts the Hyprland + Caelestia desktop as the "duyos" user with speech feedback.
ENDTEXT
MENU LABEL DuyOS live (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
