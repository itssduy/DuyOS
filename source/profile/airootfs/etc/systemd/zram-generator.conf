# DuyOS system-level modification #1: compressed swap in RAM (zram).
# A live ISO has no disk swap and its root filesystem is itself RAM-backed, so
# Firefox + Hyprland + Qt can exhaust memory on small VMs. zram gives roughly
# 2-3x effective headroom for a little CPU. Read by systemd-zram-generator at boot.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
