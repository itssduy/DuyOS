# DuyOS system-level modification #2: kernel tuning for a zram-backed desktop.

# Swapping to zram is cheap (no disk I/O), so let the kernel use it eagerly
# instead of dropping page cache. Values >100 are recommended for zram.
vm.swappiness = 180
# Read-ahead of swap pages only helps spinning disks; with zram it wastes work.
vm.page-cluster = 0
# Start reclaiming earlier/in larger batches to avoid UI stalls under pressure.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# Desktop responsiveness: allow more inotify watches (file managers, editors).
fs.inotify.max_user_watches = 524288

# Hardening: hide kernel pointers and restrict dmesg to root.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
